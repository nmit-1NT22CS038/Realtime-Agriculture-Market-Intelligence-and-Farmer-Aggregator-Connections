spring.application.name=agrilink-backend
server.port=8080


# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/agrilink_db
spring.datasource.username=agrilink_user
spring.datasource.password=agrilink_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.root=WARN
logging.level.com.agrilink.backend=INFO



