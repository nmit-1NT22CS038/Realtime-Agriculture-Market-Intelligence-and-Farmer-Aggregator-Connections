spring.application.name=agrilink-backend
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/agrilink_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

app.auth.session-hours=72
app.ml.python-command=python
app.ml.script-path=ml/predict.py
app.ml.model-path=../../Data/data_scrapper/crop_recommendation_rf.joblib
