version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: agrilink-mysql-compose
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: agrilink_db
      MYSQL_USER: agrilink_user
      MYSQL_PASSWORD: agrilink_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: agrilink-backend
    ports:
      - "8082:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/agrilink_db
      SPRING_DATASOURCE_USERNAME: agrilink_user
      SPRING_DATASOURCE_PASSWORD: agrilink_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      APP_ML_PYTHON_PATH: python3
      APP_ML_RECOMMEND_SCRIPT_PATH: /app/ml/recommend.py
      APP_ML_RAINFALL_CSV_PATH: /app/Data/rainfall_master_normalized.csv
      APP_LLM_ENABLED: ${APP_LLM_ENABLED:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: agrilink-frontend
    ports:
      - "3001:3000"
    environment:
      VITE_API_BASE_URL: http://localhost:8082/api
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  default:
    name: agrilink-network